version: "3.9"

# =============================================================================
# SensorShield — Full Stack Docker Compose
# Usage:
#   docker-compose up --build        # first run
#   docker-compose up                # subsequent runs
#   docker-compose down              # stop
#   docker-compose down -v           # stop + delete volumes
# =============================================================================

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sensorshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     sensorshield
      POSTGRES_PASSWORD: sensorshield
      POSTGRES_DB:       sensorshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensorshield -d sensorshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: sensorshield-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:            development
      DATABASE_URL:       postgresql+asyncpg://sensorshield:sensorshield@db:5432/sensorshield
      DATABASE_URL_SYNC:  postgresql://sensorshield:sensorshield@db:5432/sensorshield
      POSTGRES_HOST:      db
      POSTGRES_PORT:      5432
      POSTGRES_USER:      sensorshield
      POSTGRES_PASSWORD:  sensorshield
      POSTGRES_DB:        sensorshield
      TRUST_HIGH_THRESHOLD: "80"
      TRUST_LOW_THRESHOLD:  "50"
      LOG_LEVEL:          INFO
      CORS_ORIGINS:       "http://localhost,http://localhost:80,http://frontend"
      # Email notifications (optional)
      EMAIL_ENABLED:      "false"
      EMAIL_HOST:         smtp.gmail.com
      EMAIL_PORT:         "587"
      EMAIL_USER:         ""
      EMAIL_PASSWORD:     ""
      EMAIL_TO:           ""
    volumes:
      # Mount models and data so they persist across rebuilds
      - ./models:/app/../models
      - ./data:/app/../data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── React Frontend (Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: sensorshield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── DB Migration (runs once, then exits) ─────────────────────────────────
  migrate:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: sensorshield-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_SYNC: postgresql://sensorshield:sensorshield@db:5432/sensorshield
    volumes:
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head && echo 'Migrations complete'"
    restart: "no"

volumes:
  postgres_data:
    driver: local
